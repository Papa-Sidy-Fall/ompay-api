services:
  - type: web
    name: ompay-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/documentation
    envVars:
      - key: APP_NAME
        value: OmPay API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          type: web
          name: ompay-api
          property: host
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ompay-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ompay-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ompay-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ompay-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ompay-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@ompay.com
      - key: MAIL_FROM_NAME
        value: OmPay
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false

databases:
  - name: ompay-db
    databaseName: ompay
    user: ompay_user
    plan: starter