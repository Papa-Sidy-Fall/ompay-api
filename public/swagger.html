<!DOCTYPE html>
<html>
<head>
    <title>OmPay API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@3.25.0/swagger-ui.css" />
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin:0;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@3.25.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@3.25.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: '/api/documentation',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                validatorUrl: null,
                tryItOutEnabled: true,
                requestInterceptor: function(request) {
                    // Ajouter automatiquement le token Bearer si disponible
                    const token = localStorage.getItem('ompay_token');
                    if (token && request.url.includes('/api/')) {
                        request.headers.Authorization = 'Bearer ' + token;
                    }
                    return request;
                },
                responseInterceptor: function(response) {
                    // Sauvegarder automatiquement le token après connexion
                    if (response.url.includes('/api/otp/verify') && response.status === 200) {
                        try {
                            const data = JSON.parse(response.body);
                            if (data.succes && data.donnees && data.donnees.token) {
                                localStorage.setItem('ompay_token', data.donnees.token);
                                console.log('Token sauvegardé automatiquement');
                            }
                        } catch (e) {
                            console.log('Erreur lors de la sauvegarde du token');
                        }
                    }
                    return response;
                }
            });
        };
    </script>
</body>
</html>
